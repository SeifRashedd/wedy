[build]
  command = "npm run build"

[build.environment]
  # NEXT_PUBLIC_* vars are intentionally embedded in the client bundle by Next.js
  # They are not secrets — suppress Netlify's false-positive secrets scan failures
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "nft"
